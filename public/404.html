<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>LabelPrintStation</title>
    <script>
      // GitHub Pages SPA 404 Redirect Script
      var pathSegmentsToKeep = 1; // /LabelPrintStation/
      var l = window.location;
      var redirectPath = l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/');
      var query = l.search ? '&' + l.search.slice(1) : '';
      var hash = l.hash ? l.hash : '';
      
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        redirectPath + query + hash
      );
    </script>
  </head>
  <body>
  </body>
</html>
